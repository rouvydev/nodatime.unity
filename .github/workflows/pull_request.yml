name: Validate docs

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The skill and spec validators live in rouvydev/agent-setup-example and run on the
      # runner's preinstalled python3, so this repository needs no toolchain of its own.
      - uses: rouvydev/agent-setup-example/.github/actions/validate-agent-setup@master
